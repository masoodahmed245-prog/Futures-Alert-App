<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Futures Alert App</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b0f14;
    color: #e8edf3;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 16px;
}

h1 {
    margin-bottom: 5px;
}

h2 {
    margin-top: 24px;
}

.online {
    color: #22c55e;
    font-weight: bold;
    margin-bottom: 20px;
}

.card {
    background: #121821;
    border: 1px solid #263241;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 16px;
}

.dashboard {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.stat {
    background: #0d131b;
    border-radius: 10px;
    padding: 12px;
    text-align: center;
}

.stat-title {
    font-size: 12px;
    color: #8995a5;
}

.stat-value {
    font-size: 20px;
    font-weight: bold;
    margin-top: 5px;
}

label {
    display: block;
    margin-top: 10px;
    margin-bottom: 5px;
    color: #aeb9c7;
    font-size: 14px;
}

select,
input {
    width: 100%;
    padding: 12px;
    border-radius: 9px;
    border: 1px solid #344154;
    background: #0c1118;
    color: white;
    font-size: 15px;
}

select:focus,
input:focus {
    outline: none;
    border-color: #3b82f6;
}

.zone {
    margin-top: 16px;
    padding: 14px;
    border-radius: 12px;
    background: #0d131b;
    border: 1px solid #273344;
}

.zone-title {
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 10px;
}

.zone-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

button {
    width: 100%;
    padding: 13px;
    border: 0;
    border-radius: 9px;
    background: #2563eb;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(.98);
}

.save-btn {
    margin-top: 18px;
    background: #16a34a;
}

.test-btn {
    background: #9333ea;
}

.clear-btn {
    background: #dc2626;
}

.setting {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 12px 0;
}

.setting input {
    width: auto;
}

.coin-item {
    background: #0d131b;
    border: 1px solid #293547;
    border-radius: 10px;
    padding: 12px;
    margin-top: 8px;
}

.alert-item {
    background: #101722;
    border-left: 4px solid #f59e0b;
    padding: 10px;
    margin-top: 8px;
    border-radius: 7px;
    font-size: 14px;
}

.status {
    margin-top: 10px;
    padding: 10px;
    border-radius: 8px;
    background: #0d131b;
    color: #aeb9c7;
    font-size: 14px;
}

.good {
    color: #22c55e;
}

.bad {
    color: #ef4444;
}

.warning {
    color: #f59e0b;
}

@media (max-width: 600px) {
    .dashboard {
        grid-template-columns: 1fr;
    }

    .zone-grid {
        grid-template-columns: 1fr;
    }

    .container {
        padding: 10px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>🚀 Futures Alert App</h1>
    <div class="online">● SYSTEM ONLINE</div>

    <!-- DASHBOARD -->
    <div class="card">
        <h2>📊 Dashboard</h2>

        <div class="dashboard">

            <div class="stat">
                <div class="stat-title">Scanner</div>
                <div class="stat-value good" id="scannerStatus">STARTING</div>
            </div>

            <div class="stat">
                <div class="stat-title">Coins</div>
                <div class="stat-value" id="coinCount">0</div>
            </div>

            <div class="stat">
                <div class="stat-title">Last Alert</div>
                <div class="stat-value" id="lastAlert">None</div>
            </div>

        </div>

        <div class="status" id="connectionStatus">
            Connecting to Supabase...
        </div>
    </div>


    <!-- ZONE SETTINGS -->
    <div class="card">

        <h2>⚙️ Zone Settings</h2>

        <label>Select Coin</label>

        <!-- HH -->

            <div class="zone-title">

            <div class="zone-grid">

                <div>
                    <label>HH Price</label>

                <div>
                    <label>Zone Low</label>

            </div>

        </div>


        <!-- HL -->
        <div class="zone">

            <div class="zone-title">

                <div>
                    <label>HL Price</label>
                    <input id="hl_price" type="number" step="any">
                </div>

                <div>
                    <label>Zone Low</label>
                    <input id="hl_low" type="number" step="any">
                </div>

                <div>
                    <label>Zone High</label>
                    <input id="hl_high" type="number" step="any">
                </div>

            </div>

        </div>


        <!-- LH -->
        <div class="zone">

            <div class="zone-title">
                🟠 Lower High — LH
            </div>

            <div class="zone-grid">

                <div>
                    <label>LH Price</label>
                    <input id="lh_price" type="number" step="any">
                </div>

                <div>
                    <label>Zone Low</label>
                    <input id="lh_low" type="number" step="any">
                </div>

                <div>
                    <label>Zone High</label>
                    <input id="lh_high" type="number" step="any">
                </div>

            </div>

        </div>


        <!-- LL -->
        <div class="zone">

            <div class="zone-title">
                🔻 Lower Low — LL
            </div>

            <div class="zone-grid">

                <div>
                    <label>LL Price</label>
                    <input id="ll_price" type="number" step="any">
                </div>

                <div>
                    <label>Zone Low</label>
                    <input id="ll_low" type="number" step="any">
                </div>

                <div>
                    <label>Zone High</label>
                    <input id="ll_high" type="number" step="any">
                </div>

            </div>

        </div>


        <button class="save-btn" onclick="saveCoin()">
            💾 Save Coin & Zones
        </button>

        <button
            class="clear-btn"
            style="margin-top:10px"
            onclick="clearForm()">
            🗑️ Clear Form
        </button>

        <div class="status" id="saveStatus"></div>

    </div>


    <!-- ALERT SETTINGS -->
    <div class="card">

        <h2>🔔 Alert Settings</h2>

        <div class="setting">
            <input type="checkbox" id="soundEnabled" checked>
            <label for="soundEnabled">🔊 Sound</label>
        </div>

        <div class="setting">
            <input type="checkbox" id="vibrationEnabled" checked>
            <label for="vibrationEnabled">📳 Vibration</label>
        </div>

        <div class="setting">
            <input type="checkbox" id="notificationEnabled" checked>
            <label for="notificationEnabled">🔔 Notifications</label>
        </div>

        <button
            class="test-btn"
            onclick="testAlert()">
            🔔 Test Alert
        </button>

    </div>


    <!-- MY COINS -->
    <div class="card">

        <h2>🪙 My Coins</h2>

        <div id="myCoins">
            No saved coins yet.
        </div>

    </div>


    <!-- ALERT HISTORY -->
    <div class="card">

        <h2>📜 Alert History</h2>

        <div id="alertHistory">
            No alerts yet.
        </div>

    </div>

</div>


<script>

/* =========================================================
   SUPABASE CONFIG
========================================================= */

const SUPABASE_URL =
    "https://yuvgbynicpxnyxmnqzpk.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Hi3MyKLv2_hLzSN_Cvj4rw_aSjywuW9";


/* =========================================================
   COINS
========================================================= */

const COINS = [
    "BTCUSDT",
    "ETHUSDT",
    "BNBUSDT",
    "SOLUSDT",
    "XRPUSDT",
    "DOGEUSDT",
    "ADAUSDT",
    "AVAXUSDT",
    "LINKUSDT",
    "DOTUSDT",
    "TRXUSDT",
    "TONUSDT",
    "SUIUSDT",
    "APTUSDT",
    "ARBUSDT",
    "OPUSDT",
    "NEARUSDT",
    "INJUSDT",
    "ATOMUSDT",
    "FILUSDT",
    "ICPUSDT",
    "ETCUSDT",
    "LTCUSDT",
    "UNIUSDT",
    "HBARUSDT",
    "PEPEUSDT",
    "WIFUSDT",
    "SEIUSDT",
    "TAOUSDT",
    "RUNEUSDT"
];


/* =========================================================
   STATE
========================================================= */

let savedCoins = [];
let prices = {};
let alertHistory = [];

let alertedZones = {};

let audioContext = null;


/* =========================================================
   SUPABASE REQUEST
========================================================= */

async function supabaseRequest(
    endpoint,
    options = {}
) {

    const response = await fetch(
        SUPABASE_URL + "/rest/v1/" + endpoint,
        {
            ...options,

            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization":
                    "Bearer " + SUPABASE_KEY,

                "Content-Type":
                    "application/json",

                "Prefer":
                    "return=representation",

                ...(options.headers || {})
            }
        }
    );

    if (!response.ok) {

        const text =
            await response.text();

        throw new Error(
            response.status +
            " " +
            text
        );
    }

    const text =
        await response.text();

    return text ? JSON.parse(text) : [];
}


/* =========================================================
   INITIALIZE COIN SELECT
========================================================= */

function initializeCoins() {

    const select =
        document.getElementById(
            "coinSelect"
        );

    select.innerHTML = "";

    COINS.forEach(coin => {

        const option =
            document.createElement("option");

        option.value = coin;
        option.textContent = coin;

        select.appendChild(option);

    });

    select.addEventListener(
        "change",
        loadSelectedCoin
    );
}


/* =========================================================
   LOAD ALL SAVED COINS
========================================================= */

async function loadCoins() {

    try {

        updateConnection(
            "Loading saved zones..."
        );

        const data =
            await supabaseRequest(
                "coin_zones?select=*&order=coin.asc"
            );

        savedCoins = data || [];

        document.getElementById(
            "coinCount"
        ).textContent =
            savedCoins.length;

        renderMyCoins();

        loadSelectedCoin();

        updateConnection(
            "Supabase connected successfully.",
            true
        );

    } catch (error) {

        console.error(error);

        updateConnection(
            "Supabase error: " +
            error.message,
            false
        );
    }
}


/* =========================================================
   LOAD SELECTED COIN INTO FORM
========================================================= */

function loadSelectedCoin() {

    const coin =
        document.getElementById(
            "coinSelect"
        ).value;

    const data =
        savedCoins.find(
            item => item.coin === coin
        );

    clearForm(false);

    if (!data) {
        return;
    }

    const fields = [
        "hh_price",
        "hh_low",
        "hh_high",

        "hl_price",
        "hl_low",
        "hl_high",

        "lh_price",
        "lh_low",
        "lh_high",

        "ll_price",
        "ll_low",
        "ll_high"
    ];

    fields.forEach(field => {

        const input =
            document.getElementById(field);

        if (
            data[field] !== null &&
            data[field] !== undefined
        ) {

            input.value =
                data[field];

        }

    });

}


/* =========================================================
   GET FORM DATA
========================================================= */

function getFormData() {

    const coin =
        document.getElementById(
            "coinSelect"
        ).value;

    const fields = [
        "hh_price",
        "hh_low",
        "hh_high",

        "hl_price",
        "hl_low",
        "hl_high",

        "lh_price",
        "lh_low",
        "lh_high",

        "ll_price",
        "ll_low",
        "ll_high"
    ];

    const data = {
        coin: coin,
        enabled: true
    };

    fields.forEach(field => {

        const value =
            document.getElementById(
                field
            ).value.trim();

        data[field] =
            value === ""
                ? null
                : Number(value);

    });

    return data;
}


/* =========================================================
   SAVE COIN
========================================================= */

async function saveCoin() {

    const status =
        document.getElementById(
            "saveStatus"
        );

    try {

        const data =
            getFormData();

        status.textContent =
            "Saving...";

        const existing =
            savedCoins.find(
                item =>
                    item.coin === data.coin
            );

        if (existing) {

            await supabaseRequest(
                "coin_zones?coin=eq." +
                encodeURIComponent(data.coin),
                {
                    method: "PATCH",
                    body: JSON.stringify(data)
                }
            );

        } else {

            await supabaseRequest(
                "coin_zones",
                {
                    method: "POST",
                    body: JSON.stringify(data)
                }
            );

        }

        status.innerHTML =
            '<span class="good">' +
            "✅ " +
            data.coin +
            " saved successfully." +
            "</span>";

        await loadCoins();

    } catch (error) {

        console.error(error);

        status.innerHTML =
            '<span class="bad">' +
            "❌ Save failed: " +
            error.message +
            "</span>";
    }
}


/* =========================================================
   CLEAR FORM
========================================================= */

function clearForm(showStatus = true) {

    const fields = [
        "hh_price",
        "hh_low",
        "hh_high",

        "hl_price",
        "hl_low",
        "hl_high",

        "lh_price",
        "lh_low",
        "lh_high",

        "ll_price",
        "ll_low",
        "ll_high"
    ];

    fields.forEach(field => {

        document.getElementById(
            field
        ).value = "";

    });

    if (showStatus) {

        document.getElementById(
            "saveStatus"
        ).textContent =
            "Form cleared.";

    }
}


/* =========================================================
   RENDER MY COINS
========================================================= */

function renderMyCoins() {

    const container =
        document.getElementById(
            "myCoins"
        );

    if (!savedCoins.length) {

        container.innerHTML =
            "No saved coins yet.";

        return;
    }

    container.innerHTML = "";

    savedCoins.forEach(item => {

        const div =
            document.createElement(
                "div"
            );

        div.className =
            "coin-item";

        div.innerHTML = `
            <strong>${item.coin}</strong><br>
            HH: ${displayValue(item.hh_price)}
            | HL: ${displayValue(item.hl_price)}
            | LH: ${displayValue(item.lh_price)}
            | LL: ${displayValue(item.ll_price)}
        `;

        container.appendChild(div);

    });
}


/* =========================================================
   DISPLAY VALUE
========================================================= */

function displayValue(value) {

    return (
        value === null ||
        value === undefined ||
        value === ""
    )
        ? "-"
        : value;
}


/* =========================================================
   CONNECTION STATUS
========================================================= */

function updateConnection(
    message,
    success = null
) {

    const element =
        document.getElementById(
            "connectionStatus"
        );

    element.textContent =
        message;

    if (success === true) {

        element.className =
            "status good";

    } else if (success === false) {

        element.className =
            "status bad";

    } else {

        element.className =
            "status";
    }
}


/* =========================================================
   BINANCE PRICE FETCH
========================================================= */

async function fetchPrices() {

    try {

        const response =
            await fetch(
                "https://fapi.binance.com/fapi/v1/ticker/price"
            );

        if (!response.ok) {

            throw new Error(
                "Binance price request failed"
            );
        }

        const data =
            await response.json();

        data.forEach(item => {

            prices[item.symbol] =
                Number(item.price);

        });

        document.getElementById(
            "scannerStatus"
        ).textContent =
            "SCANNING";

        return true;

    } catch (error) {

        console.error(
            "Price error:",
            error
        );

        document.getElementById(
            "scannerStatus"
        ).textContent =
            "ERROR";

        return false;
    }
}


/* =========================================================
   CHECK ZONES
========================================================= */

function scanZones() {

    if (!savedCoins.length) {
        return;
    }

    savedCoins.forEach(item => {

        if (item.enabled === false) {
            return;
        }

        const coin =
            item.coin;

        const price =
            prices[coin];

        if (!price) {
            return;
        }


        checkZone(
            coin,
            "HH",
            item.hh_low,
            item.hh_high,
            price
        );

        checkZone(
            coin,
            "HL",
            item.hl_low,
            item.hl_high,
            price
        );

        checkZone(
            coin,
            "LH",
            item.lh_low,
            item.lh_high,
            price
        );

        checkZone(
            coin,
            "LL",
            item.ll_low,
            item.ll_high,
            price
        );

    });
}

   CHECK INDIVIDUAL ZONE
========================================================= */

    if (

        low === undefined ||
