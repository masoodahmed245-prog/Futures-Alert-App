<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future Alert App</title>

    <style>
        body {
            margin: 0;
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
        }

        .header {
            padding: 20px;
            text-align: center;
            background: #111827;
        }

        .header h1 {
            margin: 0;
        }

        .status {
            margin-top: 8px;
            color: #22c55e;
        }

        .container {
            padding: 15px;
        }

        .card {
            background: #1e293b;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 12px;
        }

        .coin {
            font-size: 20px;
            font-weight: bold;
        }

        .signal {
            margin-top: 8px;
            font-size: 18px;
        }

        .long {
            color: #22c55e;
        }

        .short {
            color: #ef4444;
        }

        .wait {
            color: #facc15;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>🚀 Future Alert App</h1>
    <div class="status">● SYSTEM ONLINE</div>
</div>

<div class="container">

    <div class="card">
        <div class="coin">BTCUSDT</div>
        <div class="signal wait">⏳ WAIT</div>
    </div>

    <div class="card">
        <div class="coin">ETHUSDT</div>
        <div class="signal wait">⏳ WAIT</div>
    </div>

    <div class="card">
        <div class="coin">SOLUSDT</div>
        <div class="signal wait">⏳ WAIT</div>
    </div>

</div>

</body>
                            </html>
